name: CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows MSVC Build, Test & Package
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -A x64
          -DBUILD_TESTS=ON

      - name: Build All Targets (Release)
        run: cmake --build build --config Release --parallel

      - name: Run Unit Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage & Compress Distribution Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/bin/Release/ffxiv-hub.exe dist/
          Copy-Item build/bin/Release/hub_payload.dll dist/
          Compress-Archive -Path dist/* -DestinationPath ffxiv-hub-windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 ffxiv-hub-windows-x64.zip).Hash
          "$hash  ffxiv-hub-windows-x64.zip" | Out-File -Encoding utf8 ffxiv-hub-windows-x64.zip.sha256
          Copy-Item ffxiv-hub-windows-x64.zip.sha256 dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffxiv-hub-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ffxiv-hub-windows-x64.zip
            ffxiv-hub-windows-x64.zip.sha256
          generate_release_notes: true
