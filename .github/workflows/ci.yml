name: CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Read-only by default; only the release job may write to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes. Tag
# runs build and publish a release, so they are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-linux:
    name: Linux ${{ matrix.cxx }} Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cxx: [ clang++, g++ ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Show Compiler
        run: ${{ matrix.cxx }} --version

      # The unit tests with -Werror, then the check-ui syntax pass over the desktop UI.
      - name: Build & Test (make)
        run: make -j"$(nproc)" CXX=${{ matrix.cxx }}

      # Only the binary: rendering docs/images is a local step (make screenshots).
      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev

      - name: Build Screenshot Tool
        run: make -j"$(nproc)" CXX=${{ matrix.cxx }} build/screenshots/hub_screenshots

  # The CMake build off Windows, the non-MSVC branch of hub_warnings (-Werror)
  # included, which the Makefile jobs never configure.
  build-linux-cmake:
    name: Linux CMake Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Unit Tests (CTest)
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ThreadSanitizer
            target: tsan
          - name: AddressSanitizer + UBSan
            target: asan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The runner's 32-bit mmap ASLR entropy breaks the LLVM 18 sanitizer runtimes'
      # shadow memory mapping ("unexpected memory mapping").
      - name: Lower mmap ASLR Entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build & Test (make ${{ matrix.target }})
        run: make -j"$(nproc)" CXX=clang++ ${{ matrix.target }}

  build-windows:
    name: Windows MSVC Build, Test & Package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -A x64
          -DBUILD_TESTS=ON

      - name: Build All Targets (Release)
        run: cmake --build build --config Release --parallel

      - name: Run Unit Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      # The archive's contents are the install() rules in CMakeLists.txt, the same
      # package a local cpack run writes.
      - name: Package (CPack)
        run: cpack --config build/CPackConfig.cmake -G ZIP -C Release -B dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffxiv-hub-windows-x64
          path: |
            build/bin/Release/ffxiv-hub.exe
            build/bin/Release/hub_payload.dll
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release Package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ffxiv-hub-release
          path: dist/ffxiv-hub-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-linux, build-linux-cmake, sanitizers ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # include/hub/version.hpp is the one place the version is written; a tag that
      # disagrees would publish binaries reporting another version.
      - name: Check Tag Matches Version
        run: |
          version=$(sed -n 's/^#define HUB_VERSION_STRING "\(.*\)"$/\1/p' include/hub/version.hpp)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match HUB_VERSION_STRING \"$version\" in include/hub/version.hpp"
            exit 1
          fi

      - name: Download Release Package
        uses: actions/download-artifact@v8
        with:
          name: ffxiv-hub-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ffxiv-hub-windows-x64.zip
          generate_release_notes: true
